spring.application.name=Api

# Database
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=jdbc:postgresql://project-postgres:5432/strapi
spring.datasource.username=strapi
spring.datasource.password=strapi
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

# Cookie Configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=None

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000

# Scraper Microservice
scraper.service.url=${SCRAPER_SERVICE_URL:http://project-scraper:5001}

# Media Microservice
media.service.url=${MEDIA_SERVICE_URL:http://project-media:5002}
media.public.url=${MEDIA_PUBLIC_URL:http://localhost:8080/images}
