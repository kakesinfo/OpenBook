services:
  project-postgres:
    container_name: project-postgres
    image: postgres:alpine3.20
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - ./Cache/postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U strapi" ]
      interval: 2s
      retries: 20

  project-liquibase:
    container_name: project-liquibase
    image: liquibase/liquibase
    depends_on:
      project-postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://project-postgres:5432/strapi
      LIQUIBASE_COMMAND_USERNAME: strapi
      LIQUIBASE_COMMAND_PASSWORD: strapi
    volumes:
      - ./Migrations/db.changelog-master.xml:/liquibase/db.changelog-master.xml
      - ./Drivers/postgresql-42.7.8.jar:/liquibase/lib/postgresql-42.7.8.jar
    entrypoint:
      - "liquibase"
      - "--classpath=/liquibase/lib/postgresql-42.7.8.jar"
      - "--changeLogFile=db.changelog-master.xml"
      - "update"

  # Run spring boot api using maven and jdk 21
  project-backend:
    container_name: project-backend
    image: maven:3.9-eclipse-temurin-21
    depends_on:
      project-liquibase:
        condition: service_completed_successfully
    volumes:
      - ./Services/service-api:/usr/src/app
      - ./Cache/service-api/.m2:/root/.m2
    ports:
      - "8080:8080"
    working_dir: /usr/src/app
    entrypoint: ["mvn", "spring-boot:run"]

  # Run frontend using node 20
  project-frontend:
      container_name: project-frontend
      image: node:20-alpine
      depends_on:
        project-liquibase:
          condition: service_completed_successfully
      volumes:
      - ./Client:/usr/src/app
      ports:
      - "3000:3000"
      working_dir: /usr/src/app
      entrypoint: ["sh", "-c", "npm ci && npm run dev"]
