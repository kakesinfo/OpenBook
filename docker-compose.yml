services:
  project-postgres:
    image: postgres:alpine3.20
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U strapi" ]
      interval: 5s
      retries: 10

  project-liquibase:
    image: liquibase/liquibase
    depends_on:
      project-postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://project-postgres:5432/strapi
      LIQUIBASE_COMMAND_USERNAME: strapi
      LIQUIBASE_COMMAND_PASSWORD: strapi
    volumes:
      - ./migrations/changelog.xml:/liquibase/changelog.xml
      - ./migrations/scripts:/liquibase/scripts
    entrypoint: ["liquibase", "--changeLogFile=changelog.xml", "update"]
