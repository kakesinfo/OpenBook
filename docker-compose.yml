services:
  project-postgres:
    container_name: project-postgres
    image: postgres:alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - ./Cache/postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U strapi" ]
      interval: 2s
      retries: 20

  # Run spring boot api using maven and jdk 21
  project-backend:
    container_name: project-backend
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    depends_on:
      project-postgres:
        condition: service_healthy
    environment:
      DATA_DIR: /data/media
      MAX_WIDTH: 640
      MAX_HEIGHT: 960
      WEBP_QUALITY: 82
      MEDIA_PUBLIC_URL: /images
      JWT_SECRET_KEY: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      JWT_EXPIRATION_TIME: 2592000000
    volumes:
      - ./Services/service-api:/usr/src/app
      - ./Cache/service-api/.m2:/root/.m2
      - ./Cache/media-data:/data/media
    ports:
      - "8080:8080"
    working_dir: /usr/src/app
    entrypoint: ["sh", "-c", "mvn install -DskipTests && mvn -f openbook-api/pom.xml spring-boot:run"]

  # Run frontend using node 20
  project-frontend:
      container_name: project-frontend
      image: node:20-alpine
      restart: unless-stopped
      depends_on:
        project-backend:
          condition: service_started
      volumes:
      - ./Client:/usr/src/app
      ports:
      - "3000:3000"
      working_dir: /usr/src/app
      entrypoint: ["sh", "-c", "npm ci && npm run dev"]
