services:
  project-postgres:
    container_name: project-postgres
    image: postgres:alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - ./Cache/postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U strapi" ]
      interval: 2s
      retries: 20

  project-liquibase:
    container_name: project-liquibase
    image: liquibase/liquibase
    depends_on:
      project-postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://project-postgres:5432/strapi
      LIQUIBASE_COMMAND_USERNAME: strapi
      LIQUIBASE_COMMAND_PASSWORD: strapi
    volumes:
      - ./Migrations/db.changelog-master.xml:/liquibase/db.changelog-master.xml
      - ./Drivers/postgresql-42.7.8.jar:/liquibase/lib/postgresql-42.7.8.jar
    entrypoint:
      - "liquibase"
      - "--classpath=/liquibase/lib/postgresql-42.7.8.jar"
      - "--changeLogFile=db.changelog-master.xml"
      - "update"

  # Run media microservice (Go)
  project-media:
    container_name: project-media
    build:
      context: ./Services/service-media
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      project-postgres:
        condition: service_healthy
    environment:
      PORT: 5002
      DATA_DIR: /data/media
      MAX_WIDTH: 640
      MAX_HEIGHT: 960
      WEBP_QUALITY: 82
      DATABASE_URL: postgresql://strapi:strapi@project-postgres:5432/strapi?sslmode=disable
    volumes:
      - ./Cache/media-data:/data/media
    ports:
      - "5002:5002"

  # Run spring boot api using maven and jdk 21
  project-backend:
    container_name: project-backend
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    depends_on:
      project-liquibase:
        condition: service_completed_successfully
      project-media:
        condition: service_started
    environment:
      MEDIA_SERVICE_URL: http://project-media:5002
      MEDIA_PUBLIC_URL: /images
      JWT_SECRET_KEY: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      JWT_EXPIRATION_TIME: 2592000000
    volumes:
      - ./Services/service-api:/usr/src/app
      - ./Cache/service-api/.m2:/root/.m2
    ports:
      - "8080:8080"
    working_dir: /usr/src/app
    entrypoint: ["sh", "-c", "mvn install -DskipTests && mvn -f openbook-api/pom.xml spring-boot:run"]

  # Run frontend using node 20
  project-frontend:
      container_name: project-frontend
      image: node:20-alpine
      restart: unless-stopped
      depends_on:
        project-liquibase:
          condition: service_completed_successfully
      volumes:
      - ./Client:/usr/src/app
      ports:
      - "3000:3000"
      working_dir: /usr/src/app
      entrypoint: ["sh", "-c", "npm ci && npm run dev"]

  # Run comics scraper service (Go)
  project-scraper:
    container_name: project-scraper
    build:
      context: ./Services/service-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      project-liquibase:
        condition: service_completed_successfully
      project-media:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://strapi:strapi@project-postgres:5432/strapi?sslmode=disable
      MEDIA_SERVICE_URL: http://project-media:5002
      PORT: 5001
      SCHEDULE_HOUR: 3
      SCHEDULE_MINUTE: 0
      SCRAPE_ON_STARTUP: "true"
      MAX_BOOKS_PER_SOURCE: 30
    volumes:
      - ./Services/service-scraper:/usr/src/app
    ports:
      - "5001:5001"
    working_dir: /usr/src/app
