spring.application.name=Api

# Database
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/openbook}
spring.datasource.username=${DATABASE_USER:openbook}
spring.datasource.password=${DATABASE_PASSWORD:openbook}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

# Liquibase Migration Settings
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=150MB

# Cookie Configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=None

security.jwt.secret-key=${JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:2592000000}

# Scraper Module Settings
scraper.enabled=true
scraper.scrape-on-startup=false
scraper.schedule-cron=${SCRAPER_SCHEDULE_CRON:0 0 3 * * *}
scraper.max-books-per-source=${SCRAPER_MAX_BOOKS_PER_SOURCE:50}

# Media Module Settings
media.data-dir=${DATA_DIR:/data/media}
media.max-width=${MAX_WIDTH:640}
media.max-height=${MAX_HEIGHT:960}
media.webp-quality=${WEBP_QUALITY:82}
media.service.url=${MEDIA_SERVICE_URL:http://localhost:8080}
media.public.url=${MEDIA_PUBLIC_URL:/images}

# Logging
logging.level.fr.openbook.media=${MEDIA_LOG_LEVEL:INFO}

# Import Settings
import.media.concurrency=${MAX_MEDIA_CONCURRENCY:8}
